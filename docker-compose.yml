services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5444:5432'
    environment:
      POSTGRES_DB: discord_limits
      POSTGRES_USER: discord_app
      POSTGRES_PASSWORD: discord_app_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/outbox/infrastructure/outbox.schema.sql:/docker-entrypoint-initdb.d/001-outbox.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U discord_app -d discord_limits']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  redis-data:
  postgres-data:
